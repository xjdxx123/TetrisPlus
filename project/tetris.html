<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TetrisPlus — 3D Glass</title>
<style>
  :root {
    --ink: #f3f5fb;
    --muted: #8b93ad;
    --accent: #6cf0ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    /* Deep indigo cosmic tint — Stage 1. The renderer clears with alpha 0
       (transparent) so this is the visible background behind the scene. A
       radial dim toward the corners helps focus the eye on the playfield
       without a heavy vignette in the post chain. */
    background:
      radial-gradient(ellipse at 50% 45%, #1a1640 0%, #0a0a1a 55%, #050510 100%);
  }
  #app {
    position: fixed;
    inset: 0;
  }
  canvas { display: block; }

  /* Top-left brand */
  .brand {
    position: fixed;
    top: 18px;
    left: 22px;
    z-index: 5;
    display: flex;
    align-items: baseline;
    gap: 8px;
    pointer-events: none;
  }
  .brand .mark {
    font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: 0.18em;
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
  }
  .brand .title {
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.04em;
    color: var(--ink);
    text-shadow: 0 0 12px rgba(108, 240, 255, 0.4);
  }

  /* Help / controls */
  .help {
    position: fixed;
    bottom: 18px;
    left: 22px;
    z-index: 5;
    background: rgba(10, 14, 24, 0.55);
    backdrop-filter: blur(10px) saturate(140%);
    -webkit-backdrop-filter: blur(10px) saturate(140%);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.7;
    letter-spacing: 0.02em;
    max-width: 280px;
    user-select: none;
    transition: opacity 0.3s;
  }
  .help.hidden { opacity: 0; pointer-events: none; }
  .help kbd {
    display: inline-block;
    min-width: 16px;
    padding: 1px 5px;
    font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: 10px;
    color: var(--ink);
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-bottom-color: rgba(255,255,255,0.04);
    border-radius: 4px;
    text-align: center;
  }
  .help .row { display: flex; justify-content: space-between; gap: 12px; }
  .help .row span:first-child { color: var(--ink); }
  .help h4 {
    margin: 0 0 6px 0;
    color: var(--ink);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-weight: 600;
  }

  /* Panel jitter — scoped to .panel-inner so it never touches the
     outer element's transform (CSS3DRenderer rewrites that every frame).
     --p is the intensity 0..1, set inline by JS based on score delta. */
  .panel-inner { --p: 0; transform-origin: center center; }
  @keyframes panel-jitter {
    0%   { transform: scale(1) translate(0, 0); }
    12%  { transform: scale(calc(1 + var(--p) * 0.10)) translate(calc(var(--p) *  6px), calc(var(--p) * -4px)); }
    24%  { transform: scale(calc(1 + var(--p) * 0.08)) translate(calc(var(--p) * -5px), calc(var(--p) *  3px)); }
    38%  { transform: scale(calc(1 + var(--p) * 0.07)) translate(calc(var(--p) *  4px), calc(var(--p) *  4px)); }
    52%  { transform: scale(calc(1 + var(--p) * 0.05)) translate(calc(var(--p) * -3px), calc(var(--p) * -2px)); }
    66%  { transform: scale(calc(1 + var(--p) * 0.03)) translate(calc(var(--p) *  2px), calc(var(--p) *  1px)); }
    82%  { transform: scale(calc(1 + var(--p) * 0.01)) translate(calc(var(--p) * -1px), 0); }
    100% { transform: scale(1) translate(0, 0); }
  }
  .panel-pulse { animation: panel-jitter 0.38s ease-out; }

  /* Level-up callout */
  .levelup {
    position: fixed;
    top: 22%;
    left: 50%;
    z-index: 7;
    transform: translate(-50%, -50%) scale(0.6);
    pointer-events: none;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-size: 56px;
    font-weight: 800;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #f3f5fb;
    text-shadow:
      0 0 24px rgba(108,240,255,0.9),
      0 0 60px rgba(108,240,255,0.6);
    opacity: 0;
  }
  .levelup.show { animation: levelup 1.1s cubic-bezier(0.2, 0.7, 0.2, 1) forwards; }
  @keyframes levelup {
    0%   { transform: translate(-50%, -50%) scale(0.6); opacity: 0; }
    18%  { transform: translate(-50%, -50%) scale(1.08); opacity: 1; }
    32%  { transform: translate(-50%, -50%) scale(1.0);  opacity: 1; }
    72%  { transform: translate(-50%, -50%) scale(1.0);  opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(0.95); opacity: 0; }
  }

  /* Multi-line clear callout (DOUBLE/TRIPLE/TETRIS) */
  .clear-callout {
    position: fixed;
    top: 36%;
    left: 50%;
    z-index: 7;
    transform: translate(-50%, -50%) scale(0.6);
    pointer-events: none;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-weight: 900;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #fff;
    opacity: 0;
  }
  .clear-callout.show { animation: clear-callout 0.85s cubic-bezier(0.2, 0.7, 0.2, 1) forwards; }
  @keyframes clear-callout {
    0%   { transform: translate(-50%, -50%) scale(0.6); opacity: 0; }
    14%  { transform: translate(-50%, -50%) scale(1.12); opacity: 1; }
    28%  { transform: translate(-50%, -50%) scale(1.0);  opacity: 1; }
    72%  { transform: translate(-50%, -50%) scale(1.0);  opacity: 1; }
    100% { transform: translate(-50%, calc(-50% - 28px)) scale(0.92); opacity: 0; }
  }

  /* Score burst — replaces the old 2D popup. The OUTER element receives the
     CSS3DRenderer transform every frame, so we animate the INNER wrapper
     (scale, color, shake, blur) without fighting the renderer. The text
     overshoots aggressively, jitters for ~120ms, then dissolves outward
     while the particle burst takes over. */
  .score-burst-outer {
    pointer-events: none;
    user-select: none;
    will-change: transform;
  }
  .score-burst-inner {
    font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
    font-size: 56px;
    font-weight: 900;
    letter-spacing: 0.04em;
    white-space: nowrap;
    transform-origin: center;
    opacity: 0;
    color: #ffffff;
    /* color via inline style; text-shadow inline too so we can color-tint */
  }
  .score-burst-inner.show {
    animation: score-burst 1.0s cubic-bezier(0.16, 0.7, 0.2, 1) forwards;
  }
  /* Phase A (0–0.10s): explosive spawn — overshoot to 1.7×, peak brightness.
     Phase B (0.10–0.22s): shake left/right 4 frames while shrinking back.
     Phase C (0.22–0.40s): pull back to 1.0×, hold full opacity briefly.
     Phase D (0.40–1.00s): dissolve — scale UP again, blur, fade to 0.
     The final upscale during fade reinforces the "exploding into pieces"
     read as the particle burst takes over. */
  @keyframes score-burst {
    0%   { transform: scale(0.45); opacity: 0; filter: blur(10px) brightness(2.4); }
    8%   { transform: scale(1.7);  opacity: 1; filter: blur(0)    brightness(2.0); }
    12%  { transform: scale(1.55) translate(-4px, 1px);  opacity: 1; filter: blur(0) brightness(1.7); }
    15%  { transform: scale(1.55) translate( 4px,-2px);  opacity: 1; filter: blur(0) brightness(1.6); }
    18%  { transform: scale(1.5)  translate(-3px, 2px);  opacity: 1; filter: blur(0) brightness(1.5); }
    21%  { transform: scale(1.5)  translate( 2px,-1px);  opacity: 1; filter: blur(0) brightness(1.45); }
    35%  { transform: scale(1.0);  opacity: 1; filter: blur(0)    brightness(1.2); }
    50%  { transform: scale(1.15); opacity: 0.85; filter: blur(2px) brightness(1.3); }
    100% { transform: scale(2.4);  opacity: 0; filter: blur(14px) brightness(0.8); }
  }
  /* Bigger, hotter burst for double/triple/tetris — same keyframe but
     prefixed scales for higher intensity. */
  .score-burst-inner.tier-2 { font-size: 68px; }
  .score-burst-inner.tier-3 { font-size: 84px; }
  .score-burst-inner.tier-4 { font-size: 104px; }

  .help-toggle, .audio-toggle, .settings-toggle {
    position: fixed;
    bottom: 18px;
    z-index: 6;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(10, 14, 24, 0.6);
    border: 1px solid rgba(255,255,255,0.12);
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    backdrop-filter: blur(10px);
    transition: color 0.2s, border-color 0.2s;
    line-height: 1;
  }
  .help-toggle     { right: 22px; }
  .audio-toggle    { right: 62px; font-size: 14px; }
  .settings-toggle { right: 102px; font-size: 16px; }
  .help-toggle:hover, .audio-toggle:hover, .settings-toggle:hover {
    color: var(--ink); border-color: rgba(108,240,255,0.5);
  }
  .audio-toggle.muted { color: rgba(255,140,140,0.9); border-color: rgba(255,140,140,0.45); }
  .settings-toggle.is-open {
    color: var(--accent); border-color: rgba(108,240,255,0.7);
    box-shadow: 0 0 16px rgba(108,240,255,0.25);
  }

  /* Game over overlay */
  .game-over {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(5, 7, 12, 0.7);
    backdrop-filter: blur(8px);
  }
  .game-over.show { display: flex; }
  .game-over .panel {
    background: linear-gradient(180deg, rgba(20,24,38,0.9), rgba(10,12,20,0.9));
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 36px 48px;
    text-align: center;
    box-shadow: 0 20px 80px rgba(0,0,0,0.6), inset 0 0 80px rgba(108,240,255,0.05);
  }
  .game-over h2 {
    margin: 0 0 6px 0;
    font-size: 28px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink);
  }
  .game-over p {
    margin: 0 0 24px 0;
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .game-over .stats {
    display: flex;
    gap: 28px;
    justify-content: center;
    margin-bottom: 24px;
  }
  .game-over .stat .v {
    font-size: 24px;
    font-weight: 700;
    color: var(--accent);
    text-shadow: 0 0 16px rgba(108,240,255,0.5);
  }
  .game-over .stat .l {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-top: 2px;
  }
  .game-over button {
    background: rgba(108, 240, 255, 0.1);
    border: 1px solid rgba(108, 240, 255, 0.5);
    color: var(--accent);
    padding: 12px 32px;
    border-radius: 8px;
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .game-over button:hover {
    background: rgba(108, 240, 255, 0.2);
    box-shadow: 0 0 24px rgba(108,240,255,0.4);
  }
</style>
</head>
<body>
  <div id="app"></div>

  <div class="brand">
    <span class="mark">TETRIS+</span>
    <span class="title">GLASS / 3D</span>
  </div>

  <div class="help" id="help">
    <h4>Controls</h4>
    <div class="row"><span>Move</span><span><kbd>←</kbd> <kbd>→</kbd></span></div>
    <div class="row"><span>Soft drop</span><span><kbd>↓</kbd></span></div>
    <div class="row"><span>Hard drop</span><span><kbd>Space</kbd></span></div>
    <div class="row"><span>Rotate</span><span><kbd>↑</kbd> / <kbd>X</kbd></span></div>
    <div class="row"><span>Hold</span><span><kbd>C</kbd> / <kbd>Shift</kbd></span></div>
    <div class="row"><span>Pause</span><span><kbd>P</kbd></span></div>
    <h4 style="margin-top:10px;">Camera</h4>
    <div class="row"><span>Orbit</span><span>Drag empty space</span></div>
    <div class="row"><span>Pan</span><span>Right-drag</span></div>
    <div class="row"><span>Zoom</span><span>Scroll</span></div>
    <div class="row"><span>Reset view</span><span><kbd>R</kbd></span></div>
    <h4 style="margin-top:10px;">Panels</h4>
    <div class="row"><span>Drag in 3D</span><span>Click + drag panel</span></div>
  </div>
  <button class="settings-toggle" id="settingsToggle" title="Settings (O)">⚙</button>
  <button class="audio-toggle" id="audioToggle" title="Mute / unmute audio">🔊</button>
  <button class="help-toggle" id="helpToggle" title="Toggle controls">?</button>
  <!-- crossorigin="anonymous" is REQUIRED for Web Audio MediaElementSource
       to capture non-silent audio (Stage 5). Without it, the element plays
       fine through the speakers but createMediaElementSource produces a
       silent capture — the analyser would read zeros forever. Same-origin
       assets are not exempt. -->
  <!-- BGM source is assigned dynamically by the playlist (src/audio/bgm-playlist.js).
       `loop` is intentionally OFF here so the playlist's `ended` listener can
       advance to the next track; the playlist re-applies looping when only one
       track is in the rotation. -->
  <audio id="bgmAudio" crossorigin="anonymous" preload="auto"></audio>

  <div class="levelup" id="levelup"></div>
  <div class="clear-callout" id="clearCallout"></div>

  <div class="game-over" id="gameOver">
    <div class="panel">
      <h2 id="goTitle">Shattered</h2>
      <p id="goSubtitle">The stack reached the top</p>
      <div class="stats">
        <div class="stat"><div class="v" id="goScore">0</div><div class="l">Score</div></div>
        <div class="stat"><div class="v" id="goLines">0</div><div class="l">Faces</div></div>
        <div class="stat"><div class="v" id="goLevel">1</div><div class="l">Level</div></div>
      </div>
      <button id="goRestart">Play Again</button>
    </div>
  </div>

  <script type="module" src="/src/app/main.js"></script>
</body>
</html>
